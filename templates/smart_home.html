<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hachi — Smart Home Simulation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    :root {
      --bg: #f8f6f0;
      --bg-card: #ffffff;
      --bg-elevated: #ffffff;
      --bg-subtle: #f2efe6;
      --text: #1c1a15;
      --text-dim: #686357;
      --text-faint: #9e978a;
      --accent: #c8922e;
      --accent-soft: rgba(200, 146, 46, 0.12);
      --border: rgba(28, 26, 21, 0.09);
      --border-strong: rgba(28, 26, 21, 0.16);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(28, 26, 21, 0.04);
      --shadow-md: 0 14px 34px -10px rgba(28, 26, 21, 0.08);
      --radius-lg: 22px;
      --radius-md: 14px;
      --font-display: 'Fraunces', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #12110e;
      --bg-card: #1c1b16;
      --bg-elevated: #1e1d18;
      --bg-subtle: #24221d;
      --text: #eae6dc;
      --text-dim: #9e988a;
      --text-faint: #635f55;
      --accent: #dca842;
      --accent-soft: rgba(220, 168, 66, 0.16);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 14px 34px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: var(--font-body); color: var(--text); background: var(--bg); }
    body { padding: 24px; transition: background .3s ease, color .3s ease; }

    .shell {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Topbar Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid rgba(200, 146, 46, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--green-soft);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all .2s ease;
    }
    .btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }

    /* Device Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card-wide { grid-column: span 1.5; }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .card-wide { grid-column: span 1; }
    }

    .device-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      position: relative;
      transition: all .25s ease;
    }
    .device-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .card-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .card-value {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      margin: 12px 0 6px;
      color: var(--text);
      transition: color .2s ease;
    }

    .visual-stage {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 6px 0 16px;
    }

    .bulb-icon {
      font-size: 32px;
      filter: grayscale(1);
      opacity: 0.4;
      transition: all .3s ease;
    }
    .device-card.light-on .bulb-icon {
      filter: none;
      opacity: 1;
      transform: scale(1.15);
      filter: drop-shadow(0 0 12px rgba(234, 179, 8, 0.6));
    }

    .thermo-bar {
      width: 80%;
      height: 10px;
      background: var(--bg-subtle);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .thermo-progress {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #3b82f6, #eab308, #ef4444);
      border-radius: 20px;
      transition: width .5s ease;
    }

    .lock-icon {
      font-size: 30px;
      transition: transform .2s ease;
    }

    .equalizer {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 30px;
    }
    .eq-bar {
      width: 6px;
      height: 6px;
      background: var(--text-faint);
      border-radius: 3px;
      transition: height .2s ease, background .2s ease;
    }
    .device-card.playing .eq-bar {
      background: var(--accent);
      animation: eqBounce .6s infinite alternate ease-in-out;
    }
    .device-card.playing .eq-bar:nth-child(2) { animation-delay: .15s; }
    .device-card.playing .eq-bar:nth-child(3) { animation-delay: .3s; }
    .device-card.playing .eq-bar:nth-child(4) { animation-delay: .45s; }
    @keyframes eqBounce { from { height: 6px; } to { height: 28px; } }

    .card-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
    }
    .action-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="shell">
  <!-- Top Header -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🏡</div>
      <div>
        <h1 class="brand-title">Smart Home Simulation</h1>
        <div class="brand-sub">Live Virtual Simulation for Hachi</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>Ready</span>
      </div>
      <button class="btn" onclick="toggleTheme()">🌓 Theme</button>
      <button class="btn" onclick="window.close()">✕ Close</button>
    </div>
  </header>

  <!-- Devices 5-Card Grid -->
  <main class="grid">
    <!-- Living Room Light -->
    <article class="device-card" id="card-living_room_light">
      <div class="card-top">
        <div class="card-title">Living Room Light</div>
        <span class="card-badge" id="livingBadge">OFF</span>
      </div>
      <div class="card-value" id="livingValue">OFF</div>
      <div class="visual-stage">
        <span class="bulb-icon">💡</span>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="sendAction('turn_on', 'living_room_light')">Turn On</button>
        <button class="action-btn" onclick="sendAction('turn_off', 'living_room_light')">Turn Off</button>
      </div>
    </article>

    <!-- Kitchen Light -->
    <article class="device-card light-on" id="card-kitchen_light">
      <div class="card-top">
        <div class="card-title">Kitchen Light</div>
        <span class="card-badge" id="kitchenBadge">ON</span>
      </div>
      <div class="card-value" id="kitchenValue">ON</div>
      <div class="visual-stage">
        <span class="bulb-icon">💡</span>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="sendAction('turn_on', 'kitchen_light')">Turn On</button>
        <button class="action-btn" onclick="sendAction('turn_off', 'kitchen_light')">Turn Off</button>
      </div>
    </article>

    <!-- Thermostat -->
    <article class="device-card" id="card-living_room_thermostat">
      <div class="card-top">
        <div class="card-title">Thermostat</div>
        <span class="card-badge">20 °C</span>
      </div>
      <div class="card-value" id="temperatureValue">20 °C</div>
      <div class="visual-stage">
        <div class="thermo-bar">
          <div class="thermo-progress" id="thermoProgress" style="width: 45%;"></div>
        </div>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="sendAction('decrease_temperature', 'living_room_thermostat', 1)">−1 °C</button>
        <button class="action-btn" onclick="sendAction('increase_temperature', 'living_room_thermostat', 1)">+1 °C</button>
      </div>
    </article>

    <!-- Front Door Lock -->
    <article class="device-card" id="card-front_door_lock" style="grid-column: span 1.5;">
      <div class="card-top">
        <div class="card-title">Front Door Lock</div>
        <span class="card-badge" id="lockBadge">UNLOCKED</span>
      </div>
      <div class="card-value" id="lockValue">UNLOCKED</div>
      <div class="visual-stage">
        <span class="lock-icon" id="lockIcon">🔓</span>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="sendAction('lock', 'front_door_lock')">Lock Door</button>
        <button class="action-btn" onclick="sendAction('unlock', 'front_door_lock')">Unlock Door</button>
      </div>
    </article>

    <!-- Entertainment -->
    <article class="device-card" id="card-entertainment" style="grid-column: span 1.5;">
      <div class="card-top">
        <div class="card-title">Entertainment & Audio</div>
        <span class="card-badge" id="mediaBadge">STOPPED</span>
      </div>
      <div class="card-value" id="mediaValue">STOPPED</div>
      <div class="visual-stage">
        <div class="equalizer">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </div>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="sendAction('play_media', 'entertainment', 'Study Music')">▶ Study Music</button>
        <button class="action-btn" onclick="sendAction('pause_media', 'entertainment')">⏸ Pause</button>
        <button class="action-btn" onclick="sendAction('stop_media', 'entertainment')">⏹ Stop</button>
      </div>
    </article>
  </main>
</div>

<script>
// Theme Management
function initTheme() {
  const saved = localStorage.getItem('hachi.theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('hachi.theme', next);
}
initTheme();

// Device state sync
async function pollState() {
  try {
    const res = await fetch('/api/smart_home/state');
    if (!res.ok) return;
    const data = await res.json();
    updateUI(data.devices || {});
  } catch (_) {}
}

function updateUI(dev) {
  // Living room
  const living = dev.living_room_light;
  if (living) {
    const on = living.on === true || living.state === 'on';
    document.getElementById('livingValue').textContent = on ? 'ON' : 'OFF';
    document.getElementById('livingBadge').textContent = on ? 'ON' : 'OFF';
    document.getElementById('card-living_room_light').classList.toggle('light-on', on);
  }
  // Kitchen
  const kitchen = dev.kitchen_light;
  if (kitchen) {
    const on = kitchen.on === true || kitchen.state === 'on';
    document.getElementById('kitchenValue').textContent = on ? 'ON' : 'OFF';
    document.getElementById('kitchenBadge').textContent = on ? 'ON' : 'OFF';
    document.getElementById('card-kitchen_light').classList.toggle('light-on', on);
  }
  // Thermostat
  const thermo = dev.living_room_thermostat;
  if (thermo) {
    const temp = thermo.temperature_c !== undefined ? thermo.temperature_c : (thermo.temperature || 20);
    document.getElementById('temperatureValue').textContent = `${temp} °C`;
    const pct = Math.min(100, Math.max(10, ((temp - 10) / 25) * 100));
    document.getElementById('thermoProgress').style.width = `${pct}%`;
  }
  // Lock
  const lock = dev.front_door_lock;
  if (lock) {
    const locked = Boolean(lock.locked);
    document.getElementById('lockValue').textContent = locked ? 'LOCKED' : 'UNLOCKED';
    document.getElementById('lockBadge').textContent = locked ? 'LOCKED' : 'UNLOCKED';
    document.getElementById('lockIcon').textContent = locked ? '🔒' : '🔓';
  }
  // Media
  const ent = dev.entertainment;
  if (ent) {
    const st = (ent.status || ent.state || 'stopped').toLowerCase();
    const isPlaying = st === 'playing';
    document.getElementById('mediaValue').textContent = isPlaying ? (ent.title || 'PLAYING') : st.toUpperCase();
    document.getElementById('mediaBadge').textContent = isPlaying ? 'PLAYING' : st.toUpperCase();
    document.getElementById('card-entertainment').classList.toggle('playing', isPlaying);
  }
}

async function sendAction(action, device, value = null) {
  try {
    const act = { action, target: device };
    if (value !== null) {
      if (typeof value === 'number') act.value = value;
      else act.title = value;
    }
    const res = await fetch('/api/smart_home/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actions: [act] })
    });
    const data = await res.json();
    if (data.success) {
      pollState();
    }
  } catch (_) {}
}

pollState();
setInterval(pollState, 2000);
</script>
</body>
</html>
