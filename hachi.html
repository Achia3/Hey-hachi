<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hachi 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f4ee;
    --bg-sidebar: #fbfaf6;
    --bg-elevated: #ffffff;
    --text: #1c1a15;
    --text-dim: #726d61;
    --text-faint: #aca795;
    --accent: #c8922e;
    --accent-soft: #c8922e1a;
    --accent-ink: #2b3a54;
    --border: rgba(28,26,21,0.09);
    --border-strong: rgba(28,26,21,0.16);
    --radius-lg: 26px;
    --radius-md: 16px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display:flex;
    min-height:100vh;
    overflow:hidden;
  }

  .app{
    display:flex;
    width:100%;
    min-height:100vh;
  }

  /* ===================== Sidebar ===================== */
  .sidebar{
    width: 248px;
    flex-shrink:0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding: 20px 14px;
  }

  .sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 2px 6px 22px;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .logo-mark{
    width:28px; height:28px;
    position:relative;
    flex-shrink:0;
  }
  .logo-mark svg{ width:100%; height:100%; }

  .logo-name{
    font-family: var(--font-display);
    font-weight:600;
    font-size:17px;
    letter-spacing:0.01em;
  }

  .collapse-btn{
    width:30px; height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .collapse-btn:hover{ border-color:var(--border-strong); color:var(--text); }
  .collapse-btn svg{ width:14px; height:14px; }

  .nav-group{
    background: var(--bg-elevated);
    border:1px solid var(--border);
    border-radius: var(--radius-md);
    padding:5px;
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-bottom:18px;
  }

  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 11px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:500;
    color: var(--text-dim);
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
    border:none;
    background:none;
    width:100%;
    text-align:left;
    font-family: var(--font-body);
  }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; }
  .nav-item:hover{ background: rgba(28,26,21,0.04); color: var(--text); }
  .nav-item.active{ background: var(--accent-soft); color: var(--accent); }

  .side-action{
    display:flex; align-items:center; gap:10px;
    padding: 10px 11px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:500;
    color: var(--text-dim);
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .side-action:hover{ background: rgba(28,26,21,0.04); color: var(--text); }
  .side-action svg{ width:16px; height:16px; }

  .sidebar-spacer{ flex:1; }

  /* ===================== Main ===================== */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 22px 30px;
  }

  .model-select{
    display:flex;
    align-items:center;
    gap:6px;
    font-family: var(--font-display);
    font-size:16px;
    font-weight:500;
    cursor:pointer;
    padding: 6px 12px 6px 4px;
    border-radius:10px;
    transition: background .15s ease;
  }
  .model-select:hover{ background: rgba(28,26,21,0.04); }
  .model-select svg{ width:13px; height:13px; color: var(--text-dim); margin-top:2px; }

  /* ===================== Hero ===================== */
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding: 0 24px;
  }

  .honeycomb{
    position:absolute;
    top: 4%;
    left:50%;
    transform: translateX(-50%);
    width: 560px;
    height:320px;
    pointer-events:none;
    opacity:0.55;
    z-index:0;
  }

  .hero-inner{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width: 720px;
  }

  .hero-title{
    font-family: var(--font-display);
    font-size: 52px;
    font-weight:500;
    letter-spacing:-0.01em;
    text-align:center;
    line-height:1.08;
    cursor:default;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: 0 16px;
  }
  .hero-title .word{
    display:inline-block;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), color .35s ease;
  }
  .hero-title:hover .word{ color: var(--text-faint); }
  .hero-title .word:hover{
    transform: translateY(-9px) rotate(var(--tilt,-2deg));
    color: var(--accent) !important;
  }
  .hero-title .word:nth-child(1){ --tilt:-3deg; }
  .hero-title .word:nth-child(2){ --tilt:2deg; }
  .hero-title .word:nth-child(3){ --tilt:-2deg; }
  .hero-title .word:nth-child(4){ --tilt:3deg; }
  .hero-title .word:nth-child(5){ --tilt:-1deg; }
  .hero-title .word:nth-child(6){ --tilt:2deg; }

  .hero-sub{
    margin-top:16px;
    font-size:14.5px;
    color: var(--text-dim);
    text-align:center;
  }
  .hero-sub b{ color: var(--text); font-weight:600; }

  /* ===================== Composer ===================== */
  .composer{
    width: 100%;
    max-width: 700px;
    margin-top: 40px;
  }

  .composer-box{
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 18px 40px -20px rgba(28,26,21,0.18);
    padding: 18px 20px 12px;
    transition: border-color .15s ease, box-shadow .2s ease;
  }
  .composer-box:focus-within{
    border-color: var(--border-strong);
    box-shadow: 0 20px 46px -18px rgba(28,26,21,0.24);
  }

  .composer-box textarea{
    width:100%;
    border:none;
    outline:none;
    resize:none;
    background:none;
    font-family: var(--font-body);
    font-size:15px;
    color: var(--text);
    line-height:1.5;
    max-height:140px;
    min-height:26px;
  }
  .composer-box textarea::placeholder{ color: var(--text-faint); }

  .composer-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
  }

  .tools-left{ display:flex; align-items:center; gap:6px; }

  .tool-btn{
    width:32px; height:32px;
    border-radius:9px;
    border:1px solid var(--border);
    background:transparent;
    color: var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tool-btn:hover{ border-color: var(--border-strong); color:var(--text); background: rgba(28,26,21,0.03); }
  .tool-btn.on{ background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .tool-btn svg{ width:15px; height:15px; }

  .tools-right{ display:flex; align-items:center; gap:8px; }

  .mic-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background: var(--accent-soft);
    color: var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .mic-btn:hover{ transform: scale(1.06); background: var(--accent); color:#fff; }
  .mic-btn svg{ width:15px; height:15px; }

  .send-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background: var(--text);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .send-btn:hover{ transform: scale(1.06); background: var(--accent-ink); }
  .send-btn svg{ width:14px; height:14px; }

  /* ===================== Voice overlay ===================== */
  .voice-overlay{
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse 100% 65% at 50% 28%, #fbf3e3 0%, #f6f4ee 68%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: 34px 40px 44px;
    opacity:0;
    pointer-events:none;
    transform: translateY(14px);
    transition: opacity .4s ease, transform .4s ease;
    z-index: 30;
  }
  .voice-overlay.active{ opacity:1; pointer-events:all; transform:translateY(0); }

  .voice-top{ display:flex; align-items:center; justify-content:space-between; width:100%; }

  .voice-status{
    font-family: var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--text-dim);
    display:flex; align-items:center; gap:7px;
  }
  .voice-status .dot{ width:6px; height:6px; border-radius:50%; background: var(--accent); animation: pulse-dot 1.4s infinite ease-in-out; }
  @keyframes pulse-dot{ 0%,100%{opacity:.35;} 50%{opacity:1;} }

  .voice-timer{ font-family: var(--font-mono); font-size:11px; color: var(--text-faint); }

  .orb-wrap{
    position:relative;
    width:230px; height:230px;
    display:flex; align-items:center; justify-content:center;
  }

  .hex-ring{
    position:absolute;
    width:100%; height:100%;
    opacity:0;
  }
  .hex-ring svg{ width:100%; height:100%; }
  .hex-ring.h1{ animation: hex-pulse 3s infinite ease-out; }
  .hex-ring.h2{ animation: hex-pulse 3s infinite ease-out 1s; }
  .hex-ring.h3{ animation: hex-pulse 3s infinite ease-out 2s; }
  @keyframes hex-pulse{
    0%{ transform: scale(0.55) rotate(0deg); opacity:0; }
    30%{ opacity:.5; }
    100%{ transform: scale(1.18) rotate(14deg); opacity:0; }
  }

  .orb-core{
    width:136px; height:136px;
    border-radius:38% 42% 40% 40%/ 46% 40% 44% 40%;
    background: radial-gradient(circle at 35% 30%, #ffe1a6, var(--accent) 48%, #9a6a1a 100%);
    box-shadow: 0 0 60px 8px rgba(200,146,46,0.3), inset 0 -10px 22px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center;
    gap:4px;
    transition: filter .3s ease, border-radius .6s ease;
  }
  .app[data-voice="thinking"] .orb-core{ filter: saturate(.55) brightness(1.02); }

  .bar{
    width:4px; border-radius:3px;
    background: rgba(40,26,4,0.55);
    height:14px;
  }
  .app[data-voice="listening"] .bar, .app[data-voice="speaking"] .bar{ animation: bar-bounce 1s infinite ease-in-out; }
  .app[data-voice="thinking"] .bar{ height:6px !important; opacity:.5; }
  .bar:nth-child(1){ animation-delay:0s; }
  .bar:nth-child(2){ animation-delay:.12s; }
  .bar:nth-child(3){ animation-delay:.24s; }
  .bar:nth-child(4){ animation-delay:.36s; }
  .bar:nth-child(5){ animation-delay:.48s; }
  @keyframes bar-bounce{ 0%,100%{ height:12px;} 50%{ height:38px;} }

  .voice-caption{
    font-family: var(--font-display);
    font-size:21px;
    font-weight:500;
    color: var(--text);
    text-align:center;
    min-height:28px;
  }
  .voice-sub{
    font-family: var(--font-mono);
    font-size:11px;
    color: var(--text-faint);
    margin-top:6px;
    text-align:center;
  }

  .voice-bottom{ display:flex; align-items:center; gap:26px; }
  .voice-ctrl{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid var(--border-strong);
    background: var(--bg-elevated);
    color: var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .voice-ctrl:hover{ transform: scale(1.06); color: var(--text); }
  .voice-ctrl svg{ width:18px; height:18px; }

  .voice-ctrl.end{ width:60px; height:60px; background:#c0433f; border:none; color:#fff; }
  .voice-ctrl.end:hover{ background:#d0524d; }
  .voice-ctrl.end svg{ width:20px; height:20px; }

  .voice-ctrl.muted{ background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  /* ===================== Loader ===================== */
  .loader-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    background: var(--bg);
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .loader-screen.visible{ opacity:1; }

  .app{
    opacity:0;
    transition: opacity 1.1s ease;
  }
  .app.revealed{ opacity:1; }

  .loader-quad{
    position:absolute;
    width:50%;
    height:50%;
    background: var(--bg);
    transition: transform 1.3s cubic-bezier(.65,0,.35,1);
    will-change: transform;
  }
  .loader-quad.tl{ top:0; left:0; transition-delay:0s; }
  .loader-quad.tr{ top:0; right:0; transition-delay:0.08s; }
  .loader-quad.bl{ bottom:0; left:0; transition-delay:0.08s; }
  .loader-quad.br{ bottom:0; right:0; transition-delay:0.16s; }

  .loader-screen.split .loader-quad.tl{ transform: translate(-100%,-100%); }
  .loader-screen.split .loader-quad.tr{ transform: translate(100%,-100%); }
  .loader-screen.split .loader-quad.bl{ transform: translate(-100%,100%); }
  .loader-screen.split .loader-quad.br{ transform: translate(100%,100%); }

  .loader-center{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .loader-screen.split .loader-center{
    opacity:0;
    transform: scale(0.92);
  }

  .loader-brand{
    position:absolute;
    top:calc(50% + 90px);
    left:50%;
    transform:translateX(-50%);
    font-family: var(--font-display);
    font-weight:600;
    font-size:15px;
    letter-spacing:0.03em;
    color: var(--text-dim);
    opacity:0;
    animation: loaderBrandIn 0.6s ease 0.3s forwards;
  }
  @keyframes loaderBrandIn{
    to{ opacity:1; }
  }

  .loader{
    scale: 0.75;
    position: relative;
    width: 200px;
    height: 200px;
    translate: 10px -20px;
  }
  .loader svg{
    position: absolute;
    top: 0;
    left: 0;
  }
  .head{
    translate: 27px -30px;
    z-index: 3;
    animation: bob 1s infinite ease-in;
  }
  .bod{
    translate: 0px 30px;
    z-index: 3;
    animation: bob 1s infinite ease-in-out;
  }
  .legr{
    translate: 75px 135px;
    z-index: 0;
    animation: rstep 1s infinite ease-in;
    animation-delay: 0.45s;
  }
  .legl{
    translate: 30px 155px;
    z-index: 3;
    animation: lstep 1s infinite ease-in;
  }
  @keyframes bob{
    0%{ transform: translateY(0) rotate(3deg); }
    5%{ transform: translateY(0) rotate(3deg); }
    25%{ transform: translateY(5px) rotate(0deg); }
    50%{ transform: translateY(0px) rotate(-3deg); }
    70%{ transform: translateY(5px) rotate(0deg); }
    100%{ transform: translateY(0) rotate(3deg); }
  }
  @keyframes lstep{
    0%{ transform: translateY(0) rotate(-5deg); }
    33%{ transform: translateY(-15px) translate(32px) rotate(35deg); }
    66%{ transform: translateY(0) translate(25px) rotate(-25deg); }
    100%{ transform: translateY(0) rotate(-5deg); }
  }
  @keyframes rstep{
    0%{ transform: translateY(0) translate(0px) rotate(-5deg); }
    33%{ transform: translateY(-10px) translate(30px) rotate(35deg); }
    66%{ transform: translateY(0) translate(20px) rotate(-25deg); }
    100%{ transform: translateY(0) translate(0px) rotate(-5deg); }
  }
  #gnd{
    translate: -140px 0;
    rotate: 10deg;
    z-index: -1;
    filter: blur(0.5px) drop-shadow(1px 3px 5px rgba(28,26,21,0.35));
    opacity: 0.25;
    animation: scroll 5s infinite linear;
  }
  @keyframes scroll{
    0%{ transform: translateY(25px) translate(50px); opacity: 0; }
    33%{ opacity: 0.25; }
    66%{ opacity: 0.25; }
    to{ transform: translateY(-50px) translate(-100px); opacity: 0; }
  }

</style>
</head>

<div class="loader-screen" id="loaderScreen">

  <div class="loader-quad tr"></div>
  <div class="loader-quad bl"></div>
  <div class="loader-quad br"></div>

  <div class="loader-center">
    <div class="loader">

          </g>
        </g>
      </svg>

      <svg class="legr" version="1.1" xmlns="http://www.w3.org/2000/svg" width="41.02537" height="64.85502" viewBox="0,0,41.02537,64.85502">

    <div class="sidebar-spacer"></div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="model-select">
        Hachi 1.0
      </div>
      <div></div>
    </div>

    <div class="hero">
      <svg class="honeycomb" viewBox="0 0 560 320" fill="none">
        <g stroke="#1c1a15" stroke-width="1" opacity="0.5">
          <path d="M180 40 L230 68 L230 124 L180 152 L130 124 L130 68 Z"/>
          <path d="M280 20 L330 48 L330 104 L280 132 L230 104 L230 48 Z"/>
          <path d="M380 40 L430 68 L430 124 L380 152 L330 124 L330 68 Z"/>
          <path d="M230 124 L280 152 L280 208 L230 236 L180 208 L180 152 Z"/>
          <path d="M330 124 L380 152 L380 208 L330 236 L280 208 L280 152 Z"/>
        </g>
      </svg>

      <div class="hero-inner">
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-sub">Interact with <b>Hachi</b> and explore the boundless creative world</p>

        <div class="composer">
          <div class="composer-box">
            <textarea id="input" placeholder="Ask Hachi to build something..." rows="1" onkeydown="handleKey(event)"></textarea>
            <div class="composer-tools">
              <div class="tools-left"></div>
              <div class="tools-right">
                <button class="mic-btn" title="Voice mode" onclick="openVoice()">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                <button class="send-btn" title="Send" onclick="sendMessage()">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <!-- Voice overlay -->

        <div class="voice-status"><span class="dot"></span><span id="voiceStatusText">Listening</span></div>
        <div class="voice-timer" id="voiceTimer">00:00</div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:26px;">
        <div class="orb-wrap">
          <div class="hex-ring h1"><svg viewBox="0 0 100 100"><path d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z" stroke="#c8922e" stroke-width="1.3" fill="none"/></svg></div>
          <div class="hex-ring h2"><svg viewBox="0 0 100 100"><path d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z" stroke="#c8922e" stroke-width="1.3" fill="none"/></svg></div>
          <div class="hex-ring h3"><svg viewBox="0 0 100 100"><path d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z" stroke="#c8922e" stroke-width="1.3" fill="none"/></svg></div>
          <div class="orb-core">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
        </div>
        <div>
          <div class="voice-caption" id="voiceCaption">Listening…</div>
          <div class="voice-sub" id="voiceSub">Speak whenever you're ready</div>

          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="voice-ctrl end" title="End voice mode" onclick="closeVoice()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="voice-ctrl" title="Switch to text" onclick="closeVoice()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

<script>
  const appEl = document.querySelector('.app');
  const inputEl = document.getElementById('input');
  const voiceOverlay = document.getElementById('voiceOverlay');
  const voiceCaption = document.getElementById('voiceCaption');
  const voiceSub = document.getElementById('voiceSub');
  const voiceStatusText = document.getElementById('voiceStatusText');
  const voiceTimer = document.getElementById('voiceTimer');
  const muteBtn = document.getElementById('muteBtn');

  /* Build the hover-animated hero title from words */
  const titleWords = ["What", "can", "I", "do", "for", "you?"];
  const heroTitle = document.getElementById('heroTitle');
  titleWords.forEach(w => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    heroTitle.appendChild(span);
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  function handleKey(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  }

  function sendMessage(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    // Placeholder: wire this up to your chat backend / message list.
  }

  /* ===== Voice mode ===== */
  let voiceTimerInterval = null;
  let voiceStateInterval = null;
  let seconds = 0;
  let muted = false;

  const voiceStates = [
    { state:'listening', status:'Listening', caption:'Listening…', sub:"Speak whenever you're ready" },
    { state:'thinking',  status:'Thinking',  caption:'Thinking…',  sub:'Putting the answer together' },
    { state:'speaking',  status:'Speaking',  caption:'Speaking…',  sub:'Tap the mic to interrupt' },
  ];
  let stateIndex = 0;

  function applyVoiceState(){
    const s = voiceStates[stateIndex];
    appEl.dataset.voice = s.state;
    voiceStatusText.textContent = s.status;
    voiceCaption.textContent = s.caption;
    voiceSub.textContent = s.sub;
    stateIndex = (stateIndex + 1) % voiceStates.length;
  }

  function openVoice(){
    voiceOverlay.classList.add('active');
    seconds = 0; stateIndex = 0;
    applyVoiceState();
    voiceTimer.textContent = '00:00';
    voiceTimerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      voiceTimer.textContent = m + ':' + s;
    }, 1000);
    voiceStateInterval = setInterval(applyVoiceState, 3400);
  }

  function closeVoice(){
    voiceOverlay.classList.remove('active');
    clearInterval(voiceTimerInterval);
    clearInterval(voiceStateInterval);
    appEl.dataset.voice = 'idle';
  }

  function toggleMute(){
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
  }

  /* ===== Loader ===== */
  (function(){
    const loaderScreen = document.getElementById('loaderScreen');
    const appScreen = document.querySelector('.app');
    if(!loaderScreen) return;

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        loaderScreen.classList.add('visible');
      });
    });

    setTimeout(function(){
      loaderScreen.classList.add('split');
      if(appScreen) appScreen.classList.add('revealed');
      setTimeout(function(){
        loaderScreen.style.display = 'none';
      }, 1500);
    }, 4000);
  })();
</script>
